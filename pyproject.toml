[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tabwriter"
version = "0.1.0"
description = "Write guitar tabs as compact text; get printable sheets with strum arrows and rhythm."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tabwriter = "tabwriter.__main__:main"

[tool.setuptools]
packages = ["tabwriter"]



